<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width" />
    <title>Register</title>
  </head>
  <body>
    <header>
      <div class="logo-title">
        <a href="index.html">
          <img
            src="images/dog-logo.png"
            alt="Logo of the dog"
            class="logo-image"
          />
        </a>
        <h1>Register</h1>
      </div>

      <nav>
        <ul>
          <li class="menu-option">
            <button class="menu-button">Menu</button>
            <ul class="dropdown-menu">
              <li><a href="index.html">Home</a></li>
              <li><a href="about.html">About</a></li>
              <li><a href="register.html">Register</a></li>
            </ul>
          </li>
          <li class="menu-option">
            <button class="menu-button">External Links</button>
            <ul class="dropdown-menu">
              <li><a href="https://en.wikipedia.org/wiki/Dog">Wiki</a></li>
              <li><a href="https://www.petfinder.com/dogs-and-puppies/breeds/">Petfinder</a></li>
              <li><a href="https://www.vetstreet.com/dogs">Vetstreet</a></li>
            </ul>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <h2 class="form-note">
        <span aria-hidden="true" class="required-note">*</span> is required to
        fill in.
      </h2>
      <form action="/register" method="POST">
        <fieldset>
          <legend>Registration</legend>

          <div class="interaction-block">
            <label for="name">Name
              <span aria-hidden="true" class="required-note">*</span>
            </label>
            <input id="name" name="name" required /><br/>
          </div>

          <div class="interaction-block">
            <label for="email">Email
              <span aria-hidden="true" class="required-note">*</span>
            </label>
            <input id="email" name="email" required /><br/>
          </div>

          <div class="annoy-block">
            <label for="annoy-me">Do you want us to send you annoying emails?</label>
            <input
              type="checkbox"
              id="annoy-me"
              name="annoy-me"
              checked
            /><br/>
          </div>

          <div class="interaction-block">
            <label for="tier">Select tier
              <span aria-hidden="true" class="required-note">*</span>
            </label>
            <select id="tier" name="tier" required>
              <option value="">Please select</option>
              <option value="1">Silver Tier</option>
              <option value="2">Gold Tier</option>
              <option value="3">Platinum Tier</option>
            </select><br/>
          </div>

          <button type="submit">Register</button>
        </fieldset>
      </form>
    </main>

    <footer>
      <h2>Website designed by Min-Yang Huang.</h2>
    </footer>

  </body>
</html>
