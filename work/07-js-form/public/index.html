<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="main.js"></script>
  </head>
  <body>
    <header>
      <h1>Registration Page</h1>
    </header>

    <div class="title-prompt">
      <h2>Please fill out the form and submit</h2>
      <h3><span class="required-note">*</span> is required to fill in.</h3>
    </div>

    <form action="/register" method="POST" class="register-form">
      <div class="form-section">
        <label for="name">Name <span class="required-note">*</span></label>
        <input type="text" id="name" name="name" class="name-input"/><br />
        <span class="error__text"></span>
      </div>

      <div class="form-section">
        <label for="email">Email <span class="required-note">*</span></label>
        <input type="text" id="email" name="email" class="email-input" /><br />
        <span class="error__text"></span>
      </div>

      <div class="form-section">
        <label for="confirm-email">Confirm Email <span class="required-note">*</span></label>
        <input type="text" id="confirm-email" name="confirm-email" class="confirm-email-input" /><br />
        <span class="error__text"></span>
      </div>

      <div class="form-section">
        <label for="wants-spam">Do you want us to spam you every second?</label>
        <input type="checkbox" id="wants-spam" name="wants-spam"></br>
      </div>

      <div class="form-section">
        <label for="tier">How often do you go to gym?</label>
        <select id="tier" name="tier">
            <option value="0">(Choose an option)</option>
            <option value="4">7 times a week or more</option>
            <option value="3">4 ~ 6 times a week</option>
            <option value="2">1 ~ 3 times a week</option>
            <option value="1">Never</option>
        </select></br>
      </div>

    </form>
  </body>
</html>
